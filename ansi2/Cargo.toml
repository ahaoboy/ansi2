[package]
name = "ansi2"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
description = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }

[dependencies]
clap = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
html-escape = { workspace = true }
base64 = { workspace = true, optional = true }
image = { workspace = true, optional = true }
oxvg_optimiser = { workspace = true, optional = true }
oxvg_ast = { workspace = true, optional = true }
which-shell = { workspace = true, optional = true }
git-version = { workspace = true, optional = true }
const-str = { workspace = true, optional = true }
opener = { workspace = true, optional = true }

[dev-dependencies]
insta = { workspace = true }

[features]
default = ["cli"]
sequin = []
image = ["dep:image"]
cli = [
  "dep:clap",
  "dep:thiserror",
  "dep:base64",
  "dep:which-shell",
  "dep:git-version",
  "dep:const-str",
  "dep:opener",
  "image",
  "minify",
  "sequin",
]
wasm = ["dep:wasm-bindgen"]
minify = ["dep:oxvg_ast", "dep:oxvg_optimiser", "oxvg_optimiser/wasm"]

[[bin]]
required-features = ["cli"]
name = "ansi2"
